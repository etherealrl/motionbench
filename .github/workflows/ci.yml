name: ci

# a push to main only runs it here, a fork gets it on its pull requests
on:
  workflow_dispatch:
  # closed too, since a merged release pull request is what makes the release
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

# a new push makes the run for the one before it pointless, though never the release's
concurrency:
  # a merged pull request's ref is main, so each release gets its number, and a later merge can't cancel it
  group: ci-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  check:
    if: github.event.action != 'closed' && (github.event_name != 'push' || github.repository == 'etherealrl/motionbench')
    runs-on: windows-latest
    env:
      # nobody debugs a CI build, and without the debug info it builds faster and the cache is way smaller
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # rustup reads rust-toolchain.toml and installs the pinned toolchain with rustfmt and clippy
      - run: rustup show active-toolchain
      # the compiled dependencies are most of the time this job takes
      - uses: Swatinem/rust-cache@v2
      # the packages bun installs are checked against bun.lock, and the runtime downloads against the hashes
      # pinned in the setup script, so a cached copy is as safe as a fresh one, even for the installer
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: .dependency-cache
          key: vision-${{ hashFiles('tools/vision/setup-vision.ps1') }}
      - run: bun install --frozen-lockfile
      # the desktop crate bundles these files, so it doesn't build without them
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/vision/setup-vision.ps1
      - run: bash scripts/check.sh
        shell: bash

  # merging a release/<version> pull request releases it: a draft release on the merge, the installer built from
  # that commit and attached, then it's published, which is when the app sees it. a release made from here can't
  # start another workflow, so it all happens in this one. what people download is built here, never on someone's
  # machine, and its Rust build has no cache, so nothing from an earlier build can end up in it
  installer:
    if: >-
      github.event.action == 'closed' && github.event.pull_request.merged
      && github.event.pull_request.base.ref == 'main'
      && startsWith(github.event.pull_request.head.ref, 'release/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NOTES: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          version="${BRANCH#release/}"
          # the update file says this version, so the app being built has to be it too
          built="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$built" != "$version" ]; then
            echo "the branch says $version but Cargo.toml says $built" >&2
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          # a rerun after a failure finds the last try's draft, a published release is never touched
          if [ "$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "v$version" --yes --cleanup-tag
          fi
          gh release create "v$version" --draft --target "$COMMIT" --title "Motion Bench $version" --notes "$NOTES"
      - uses: oven-sh/setup-bun@v2
      - run: rustup show active-toolchain
      # the packages bun installs are checked against bun.lock, and the runtime downloads against the hashes
      # pinned in the setup script, so a cached copy is as safe as a fresh one, even for the installer
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: .dependency-cache
          key: vision-${{ hashFiles('tools/vision/setup-vision.ps1') }}
      - run: bun install --frozen-lockfile
      # the pinned ONNX Runtime and DirectML the installer bundles, checked against their hashes
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/vision/setup-vision.ps1
      # the update files are signed with the key the app checks them against, a local build skips them so it
      # doesn't need the key
      - run: bun run tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # latest.json is what the app reads to find a newer release, through the latest release's download link
      - shell: bash
        run: |
          version="${TAG#v}"
          dir=target/release/bundle/nsis
          exe="MotionBench_${version}_x64-setup.exe"
          mv "$dir/Motion Bench_${version}_x64-setup.exe" "$dir/$exe"
          mv "$dir/Motion Bench_${version}_x64-setup.exe.sig" "$dir/$exe.sig"
          jq -n --arg version "$version" --arg notes "$NOTES" --arg signature "$(cat "$dir/$exe.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$exe" \
            '{version: $version, notes: $notes, pub_date: (now | todate),
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > latest.json
          gh release upload "$TAG" "$dir/$exe" "$dir/$exe.sig" latest.json --clobber
          gh release edit "$TAG" --draft=false
