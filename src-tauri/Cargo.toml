[package]
name = "motion-bench-desktop"
version = "0.3.2"
edition = "2024"

[[bin]]
name = "motion-bench"
path = "src/main.rs"

[features]
# the aim controller and its experiment; the core's own developer tools with it
developer-tools = ["motion-bench/developer-tools"]

[dependencies]
motion-bench = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
libloading = "=0.9.0"
hidapi = "=2.6.7"
windows = { version = "0.62.2", features = [
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Performance",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_Media_Audio",
] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
  "std",
  "load-dynamic",
  "cuda",
  "tensorrt",
  "directml",
  "api-24",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
motion-bench = { path = "..", features = ["testkit"] }
anybox-rs = { version = "0.7", features = ["mock"] }
tempfile = "3"
