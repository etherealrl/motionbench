[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "2"

[package]
name = "motion-bench"
version = "0.3.3"
default-run = "motion-bench-cli"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
description = "compares mouse movement and USB request observations from USBPcap"

[[bin]]
name = "motion-bench-cli"
path = "src/main.rs"

[features]
developer-tools = []
# exposes the test builders to the replay fixture generator, never part of a release
testkit = []
# the end to end tests' build sees no USBPcap, since starting USBPcapCMD asks for admin every time
e2e = []

[dependencies]
# one API for the boxes, which re-exports the medius crate it drives (`anybox::medius`), so
# there is one version of it in the tree by construction
anybox-rs = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# `mock` forwards to the medius crate's mock box, which the box layer's tests drive
anybox-rs = { version = "0.7", features = ["mock"] }
